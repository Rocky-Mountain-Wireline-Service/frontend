<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="theme-color" content="#710a0c" />

    <!--
      Preconnect only to gstatic: the stylesheet request to fonts.googleapis.com
      happens immediately anyway, so preconnecting to it saves nothing, while the
      font files on gstatic are not discovered until the CSS parses.
    -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--
      Applies the stored theme before first paint. The prerendered HTML carries
      no data-theme, so without this a visitor who chose dark would see a white
      page flash before hydration corrected it. Deliberately inline and
      synchronous: a deferred script runs too late to prevent the flash.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('rmws-theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) {}
      })();
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
