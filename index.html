<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#710a0c" />

  </head>
  <body>
    <!--
      Applies the stored theme before first paint. The prerendered HTML carries
      no data-theme, so without this a visitor who chose dark would see a white
      page flash before hydration corrected it. Deliberately inline and
      synchronous: a deferred script runs too late to prevent the flash.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('rmws-theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
          }
          // Anything else, including the 'system' value the earlier three-way
          // toggle wrote, leaves the attribute off so the CSS follows the OS.
        } catch (e) {}
      })();
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
