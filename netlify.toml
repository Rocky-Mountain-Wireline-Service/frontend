[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ─── Legacy URL redirects ────────────────────────────────────────────────────
# The legal pages gained hyphens in the rebuild. These paths are indexed and
# linked from the live site, so they redirect permanently rather than 404.

[[redirects]]
  from = "/privacypolicy"
  to = "/privacy-policy"
  status = 301
  force = true

[[redirects]]
  from = "/termsconditions"
  to = "/terms-and-conditions"
  status = 301
  force = true

# ─── Headers ─────────────────────────────────────────────────────────────────

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ─── SPA fallback ────────────────────────────────────────────────────────────
# Every route is prerendered to its own HTML file, and Netlify serves those
# first. This only catches client-side navigation to a path with no prerendered
# file, and must stay last so it cannot shadow the redirects above.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
