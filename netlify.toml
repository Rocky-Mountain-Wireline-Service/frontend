[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ─── Legacy URL redirects ────────────────────────────────────────────────────
# The legal pages gained hyphens in the rebuild. These paths are indexed and
# linked from the live site, so they redirect permanently rather than 404.

[[redirects]]
  from = "/privacypolicy"
  to = "/privacy-policy"
  status = 301
  force = true

[[redirects]]
  from = "/termsconditions"
  to = "/terms-and-conditions"
  status = 301
  force = true

# The old site's sitemap address, which Search Console may still have on file.
[[redirects]]
  from = "/sitemap/*"
  to = "/sitemap.xml"
  status = 301
  force = true

# ─── Headers ─────────────────────────────────────────────────────────────────

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    # rmws.com only. includeSubDomains would also force HTTPS on every company
    # subdomain, including Microsoft 365 and any device the client runs on one.
    Strict-Transport-Security = "max-age=31536000"
    # What the site may load. 'unsafe-inline' scripts are needed for the two
    # inline scripts every page carries (the dark-mode setter, and the page data
    # vite-ssg writes, which differs per page so cannot be hashed); everything
    # else is held to the site itself, Sanity, Google Analytics and the map.
    Content-Security-Policy = """default-src 'self'; \
      script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; \
      style-src 'self' 'unsafe-inline'; \
      img-src 'self' data: https://cdn.sanity.io https://*.google-analytics.com https://*.googletagmanager.com; \
      font-src 'self' data:; \
      connect-src 'self' https://29kbekqj.api.sanity.io https://29kbekqj.apicdn.sanity.io https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; \
      frame-src https://www.google.com https://maps.google.com https://www.openstreetmap.org; \
      object-src 'none'; \
      base-uri 'self'; \
      form-action 'self'; \
      frame-ancestors 'self'; \
      upgrade-insecure-requests"""

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ─── Not found ───────────────────────────────────────────────────────────────
# Every page is prerendered to its own file, so there is no catch-all rewrite
# to index.html: that answered any made-up address with the homepage and a 200,
# which search engines treat as a "soft 404" and count against the site.
# Netlify serves dist/404.html with a real 404 status instead. Navigation inside
# the site is handled by the router in the browser and never reaches here.
